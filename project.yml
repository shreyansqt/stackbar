# XcodeGen spec. If you install xcodegen (`brew install xcodegen`), run
# `xcodegen generate` here to regenerate StackBar.xcodeproj from scratch.
name: StackBar
options:
  bundleIdPrefix: com.shreyans
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  StackBar:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: StackBar
        LSMinimumSystemVersion: "14.0"
        # Menu-bar-only: no Dock icon, no main window.
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shreyans.stackbar
        PRODUCT_NAME: StackBar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: Sources/StackBar.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
