# XcodeGen spec. If you install xcodegen (`brew install xcodegen`), run
# `xcodegen generate` here to regenerate StackBar.xcodeproj from scratch.
name: StackBar
options:
  bundleIdPrefix: com.shreyans
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  StackBar:
    type: application
    platform: macOS
    sources:
      - path: Sources
    postBuildScripts:
      # Bundle the MCP server into Contents/Resources/mcp/mcp.js so the DMG ships
      # it inside the app. Colleagues register it with `claude mcp add` pointing at
      # the in-app path — no repo clone / npm install needed. See Scripts/bundle-mcp.sh.
      # alwaysOutOfDate: the bundle depends on tools/src/*.ts, which Xcode doesn't
      # track — without this the phase is cached and ships a stale mcp.js when only
      # the TS sources change.
      - script: '"$SRCROOT/Scripts/bundle-mcp.sh"'
        name: Bundle MCP server
        basedOnDependencyAnalysis: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: StackBar
        LSMinimumSystemVersion: "14.0"
        # Menu-bar-only: no Dock icon, no main window.
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shreyans.stackbar
        PRODUCT_NAME: StackBar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: Sources/StackBar.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  StackBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: StackBar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
